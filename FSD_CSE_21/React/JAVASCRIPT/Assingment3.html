<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content:center ;
        }
        .box{
            border: solid;
            border-width: 5px;
            width: 600px;
            height: 600px;
            padding: 10%;
            
            
        }
        .heading{
            
            display: flex;
            justify-self: center;
            align-items: center;
            
        }
        .Uin{
            border: solid;
            width: 400px;
            height: 70px;
            display: flex;
            justify-self: center;
            justify-content: center;
        }


    </style>
</head>
<body>
    <div class="box">
        <div class="heading">
        <img src="https://s.yimg.com/fz/api/res/1.2/qmSyyqWEp8H3WrIOjnJ0FQ--~C/YXBwaWQ9c3JjaGRkO2ZpPWZpbGw7aD00MTI7cHhvZmY9NTA7cHlvZmY9MTAwO3E9ODA7c3M9MTt3PTM4OA--/https://i.pinimg.com/736x/9f/ec/a1/9feca19d52cdf4a5b6587ea3abe4ce2e.jpg" width="100px" height="100px">
        <h3>BUS Booking System</h3>
        </div>
        <div class="Uin">
           <center> <h1>USER INFORMATION</h1></center>
        </div>
        <br>

        <form onsubmit="handle(event)">
            <div>
                <label for="username">User Name:</label>
                <input type="text" name="username">
            </div>
            <br>
            <div>
                <label for="userage">User Age:</label>
                <input type="number" name="userage">
            </div>
            <br>
            <div>
                <label for="Adhaar">User Adhaar:</label>
                <input type="text" name="Adhaar">
            </div>
            <br>
            <div>
                <label for="city">Select your city:</label>
                <select name="city" >
                    <option>Ghaziabad</option>
                    <option>Delhi</option>
                    <option>Varanasi</option>
                    <option>Noida</option>
                </select>

            </div>
            <br>
            <div>
                <label for="date">Journey Date:</label>
                <input type="Date" name="date">
            </div>
            <br>
            <div class="Uin">
           <center> <h1>BUS INFORMATION</h1></center>
        </div>
        <br>
        <div>
                <label for="bo">AC BUS 2000$</label>
                <input type="radio" name="bo">
            </div>
            <br>
            <div>
                <label for="bo">NON AC BUS 1500$</label>
                <input type="radio" name="bo">
            </div>
            <br>
            <div>
                <label for="seat">Select Number Of Seats:</label>
                <select name="seat" >
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <br>
            <button id="onclick">BOOK NOW</button>
        </form>
    </div>
    <script>
        function handel(event){
            event.preventDefault();
            const formElement = event.target;
            const fromData = new FormData(formElement);
            const formValues = Object.fromEntries(formData.entries());
            console.log("form submitted Successfully");
            console.log(formValues);
        }
    </script>
</body>
</html>
